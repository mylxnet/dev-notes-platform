# 1Panel「容器 → Compose → 创建」直接粘贴本文件内容。
# 镜像：阿里云 registry.cn-hangzhou.aliyuncs.com/mylxnet/dev-notes
# 数据：宿主机 ./data 映射到容器 /app/data（内含 notes.db 与 media/）。
services:
  dev-notes:
    # tag 必须先在 WSL 内用 scripts/push-image.sh 推送，否则 1Panel 拉不到镜像。
    image: registry.cn-hangzhou.aliyuncs.com/mylxnet/dev-notes:1.4.7
    container_name: dev-notes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATA_DIR: /app/data
      COOKIE_SECURE: auto
      LOG_LEVEL: info
      # 首次启动才写入管理员；admin 表非空后这两项无效，改密走后台。
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?请在 .env 中设置 ADMIN_INIT_PASSWORD（至少 12 位）}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET（至少 32 位）}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
